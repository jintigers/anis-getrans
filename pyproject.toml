[project]
name = "anis-getrans"
version = "0.2.0"
description = "ANIS GeTrans — 일본어↔한국어 번역기 (Gemma 4 E2B 기반, CLI·웹 GUI·로컬 API 서버)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE-ko.md" }
dependencies = [
    "torch>=2.6",
    "transformers>=5.22,<6",
    "peft>=0.21,<0.22",
    "accelerate>=1.0",
    "safetensors>=0.5",
    "huggingface_hub>=1.0",
]

[project.scripts]
anis-getrans = "anis_getrans.cli:main"
anis-getrans-gui = "anis_getrans.web:main"
anis-getrans-server = "anis_getrans.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anis_getrans"]
